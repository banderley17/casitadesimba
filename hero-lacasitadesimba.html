<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero - La Casita de Simba</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Nunito', sans-serif; overflow-x: hidden; }

  /* ─── HEADER ─── */
  header {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .header-container {
    max-width: 1300px;
    margin: auto;
    padding: 0.85rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    color: white;
    text-decoration: none;
  }
  .logo-img {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
  }
  .logo-text {
    font-family: 'Dancing Script', cursive;
    font-size: 1.5rem;
    font-weight: 700;
    color: white;
  }
  nav {
    display: flex;
    gap: 2rem;
    align-items: center;
  }
  nav a {
    color: white;
    text-decoration: none;
    font-weight: 700;
    font-size: 0.95rem;
    position: relative;
    transition: opacity 0.2s;
  }
  nav a.active {
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  nav a:hover { opacity: 0.8; }
  .btn-whatsapp-nav {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: transparent;
    border: 2px solid white;
    color: white;
    padding: 0.5rem 1.2rem;
    border-radius: 50px;
    font-weight: 700;
    font-size: 0.9rem;
    text-decoration: none;
    transition: background 0.25s, color 0.25s;
  }
  .btn-whatsapp-nav:hover { background: white; color: #222; }

  /* ─── HERO ─── */
  .hero {
    position: relative;
    height: 100vh;
    min-height: 760px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
    color: white;
  }
  .hero-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }
  /* Fallback bg si no hay vídeo */
  .hero-bg-fallback {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #2d4a1e 0%, #4a7c35 40%, #3d6b2a 70%, #1e3410 100%);
    z-index: 0;
  }
  .hero-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.42);
    z-index: 1;
  }
  .hero-content {
    position: relative;
    z-index: 5;
    max-width: 900px;
    padding: 2rem;
    animation: fadeUp 0.9s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Título principal */
  .hero h1 {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(3.5rem, 8vw, 7rem);
    font-weight: 700;
    line-height: 1.05;
    text-shadow: 0 6px 30px rgba(0,0,0,0.55);
    margin-bottom: 1.4rem;
    letter-spacing: -0.5px;
  }

  /* Badge "Guardería Canina" */
  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.55rem 1.4rem;
    border-radius: 999px;
    background: #4a8c2a;
    font-size: 0.85rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 1.3rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .hero-badge span { font-size: 1rem; }

  /* Subtítulo */
  .hero-description {
    font-size: 1.25rem;
    font-weight: 400;
    color: rgba(255,255,255,0.92);
    margin-bottom: 2.5rem;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
  }

  /* Botones */
  .hero-buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1.2rem;
    flex-wrap: wrap;
    margin-bottom: 3rem;
  }
  .hero-btn {
    padding: 0.85rem 2.2rem;
    border-radius: 80px;
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 800;
    transition: transform 0.3s, box-shadow 0.3s;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  .hero-btn-primary {
    background: #E8735A;
    color: white;
    box-shadow: 0 10px 30px rgba(232,115,90,0.4);
  }
  .hero-btn-primary:hover {
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 18px 40px rgba(232,115,90,0.5);
  }
  .hero-btn-secondary {
    background: rgba(30,30,30,0.65);
    color: white;
    border: 2px solid rgba(255,255,255,0.25);
    backdrop-filter: blur(10px);
  }
  .hero-btn-secondary:hover {
    background: rgba(50,50,50,0.8);
    transform: translateY(-4px) scale(1.03);
  }

  /* Stats row */
  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 4rem;
    flex-wrap: wrap;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.15rem;
  }
  .stat-value {
    font-size: 1.9rem;
    font-weight: 800;
    line-height: 1;
  }
  .stat-value.script {
    font-family: 'Dancing Script', cursive;
    font-size: 2.2rem;
  }
  .star-row {
    display: flex;
    align-items: center;
    gap: 0.15rem;
    font-size: 1.9rem;
    font-weight: 800;
    line-height: 1;
  }
  .star-row .star { color: #FFD700; font-size: 1.3rem; }
  .stat-label {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.75);
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  /* Scroll arrow */
  .hero-scroll {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    cursor: pointer;
    animation: bounce 2s infinite;
    text-decoration: none;
    font-size: 1.1rem;
  }
  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(8px); }
  }

  /* WhatsApp float */
  .whatsapp-float {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    z-index: 999;
    width: 56px;
    height: 56px;
    background: #25D366;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1.6rem;
    text-decoration: none;
    box-shadow: 0 6px 25px rgba(37,211,102,0.45);
    transition: transform 0.3s;
  }
  .whatsapp-float:hover { transform: scale(1.12); }
</style>
</head>
