<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Reseñas — La Casita de Simba</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #fff9f5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }

  .card {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    padding: 2.5rem 3rem;
    text-align: center;
    max-width: 420px;
    width: 100%;
    border: 3px solid #F08A7C;
  }

  .paw { font-size: 2.2rem; margin-bottom: .4rem; }

  h1 {
    font-size: 1.5rem;
    color: #2d2d2d;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: .3rem;
  }

  .sub {
    color: #F08A7C;
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 1.6rem;
  }

  #qrcode {
    display: flex;
    justify-content: center;
    margin-bottom: 1.6rem;
  }

  #qrcode img, #qrcode canvas {
    border-radius: 12px;
    border: 6px solid #F08A7C;
  }

  .instruccion {
    background: #fff4f2;
    border-radius: 12px;
    padding: 1rem 1.2rem;
    font-size: .93rem;
    color: #555;
    line-height: 1.6;
    margin-bottom: 1.4rem;
  }

  .instruccion strong { color: #F08A7C; }

  .estrellas { font-size: 1.6rem; letter-spacing: 3px; margin-bottom: .4rem; }

  .gracias {
    font-size: .85rem;
    color: #aaa;
    margin-top: .5rem;
  }

  @media print {
    body { background: #fff; padding: 0; }
    .card { box-shadow: none; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="paw">🐾</div>
  <h1>¿Te gustó La Casita de Simba?</h1>
  <p class="sub">¡Cuéntaselo a otros dueños de peluditos!</p>

  <div id="qrcode"></div>

  <div class="instruccion">
    <strong>① Abre la cámara</strong> de tu móvil<br>
    <strong>② Enfoca el QR</strong> y pulsa el enlace<br>
    <strong>③ Deja tu reseña</strong> en Google 🙏
  </div>

  <div class="estrellas">⭐⭐⭐⭐⭐</div>
  <p style="font-size:.9rem;color:#555;font-weight:600;">¡Tu opinión nos ayuda muchísimo!</p>
  <p class="gracias">lacasitadesimba.com · 📞 613 753 680</p>
</div>

<script>
  new QRCode(document.getElementById("qrcode"), {
    text: "https://g.page/r/CW-JiZsI3vjVEBM/review",
    width: 220,
    height: 220,
    colorDark: "#2d2d2d",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });
</script>

</body>
</html>
