<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Casita de Simba · Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f172a;--card:#1e293b;--card2:#243044;--border:rgba(255,255,255,.08);
  --purple:#7c3aed;--purple2:#6d28d9;--green:#10b981;--yellow:#f59e0b;
  --red:#ef4444;--text:#f1f5f9;--muted:rgba(241,245,249,.45);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px}

/* ── LOGIN ── */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at top,#1e1040 0%,var(--bg) 70%);padding:1.5rem;
}
.login-card{
  background:var(--card);border:1px solid var(--border);border-radius:24px;
  padding:2.5rem 2rem;width:100%;max-width:360px;text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.5);
}
.login-logo{font-size:2.8rem;margin-bottom:.5rem}
.login-title{font-size:1.25rem;font-weight:800;margin-bottom:.25rem}
.login-sub{font-size:.85rem;color:var(--muted);margin-bottom:2rem}
.login-input{
  width:100%;background:rgba(255,255,255,.07);border:1px solid var(--border);
  color:var(--text);border-radius:12px;padding:.8rem 1rem;font-size:1rem;
  text-align:center;letter-spacing:.15em;margin-bottom:1rem;
  transition:border-color .2s;
}
.login-input:focus{outline:none;border-color:var(--purple)}
.login-input::placeholder{color:var(--muted);letter-spacing:normal}
.login-remember{display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:.85rem;color:var(--muted);margin-bottom:1.2rem;cursor:pointer}
.login-remember input{accent-color:var(--purple);width:16px;height:16px;cursor:pointer}
.login-btn{
  width:100%;background:var(--purple);border:none;color:white;border-radius:12px;
  padding:.85rem;font-size:1rem;font-weight:700;cursor:pointer;transition:background .2s;
}
.login-btn:hover{background:var(--purple2)}
.login-error{font-size:.82rem;color:var(--red);margin-top:.75rem;display:none}

/* ── DASHBOARD ── */
#dashboard{display:none;flex-direction:column;min-height:100vh}
.dash-header{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:.9rem 1.2rem;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.dash-brand{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1rem}
.dash-brand-icon{font-size:1.4rem}
.dash-logout{background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:.3rem .75rem;font-size:.8rem;cursor:pointer;transition:all .2s}
.dash-logout:hover{border-color:var(--red);color:var(--red)}
.dash-tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);padding:.6rem 1.2rem;gap:.5rem;position:sticky;top:57px;z-index:99}
.dash-tab{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:.55rem;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .2s;text-align:center}
.dash-tab.active{background:var(--purple);border-color:var(--purple);color:white}
.dash-tab:hover:not(.active){background:rgba(255,255,255,.1);color:var(--text)}
.dash-content{padding:1.2rem;flex:1;max-width:700px;margin:0 auto;width:100%}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin-bottom:1.2rem}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1rem .8rem;text-align:center}
.stat-card .s-icon{font-size:1.4rem;margin-bottom:.3rem}
.stat-card .s-label{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.6rem}
.stat-row{display:flex;flex-direction:column;gap:.2rem}
.stat-row .s-item{display:flex;justify-content:space-between;align-items:center;font-size:.78rem}
.stat-row .s-item span:first-child{color:var(--muted);font-size:.7rem}
.stat-row .s-item strong{color:#a78bfa;font-size:.9rem}
.stats-refresh-row{text-align:right;margin-bottom:.5rem}
.btn-refresh{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:.3rem .8rem;font-size:.75rem;cursor:pointer;transition:all .2s}
.btn-refresh:hover{border-color:rgba(255,255,255,.3);color:var(--text)}
.stats-updated{font-size:.72rem;color:var(--muted);text-align:center;margin-top:.5rem}

/* ── CLIENTES ── */
.cl-summary{display:flex;gap:.6rem;margin-bottom:1rem}
.cl-badge{display:flex;align-items:center;gap:.35rem;font-size:.8rem;font-weight:800;padding:.4rem .9rem;border-radius:20px}
.cl-badge.consulta{background:rgba(245,158,11,.12);color:var(--yellow);border:1px solid rgba(245,158,11,.3)}
.cl-badge.cliente {background:rgba(16,185,129,.12);color:var(--green); border:1px solid rgba(16,185,129,.3)}
.cl-badge .cl-cnt{font-size:1rem}
.btn-new{
  width:100%;background:var(--purple);border:none;color:white;border-radius:12px;
  padding:.7rem;font-size:.9rem;font-weight:700;cursor:pointer;
  transition:background .2s;margin-bottom:1rem;display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.btn-new:hover{background:var(--purple2)}

/* Form añadir */
.cl-form{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.1rem;margin-bottom:1rem;display:none;flex-direction:column;gap:.6rem}
.cl-form.open{display:flex}
.cl-form input,.cl-form select,.cl-form textarea{
  background:rgba(255,255,255,.07);border:1px solid var(--border);
  color:var(--text);border-radius:10px;padding:.65rem .9rem;font-size:.9rem;width:100%;
}
.cl-form input:focus,.cl-form select:focus,.cl-form textarea:focus{outline:none;border-color:var(--purple)}
.cl-form input::placeholder,.cl-form textarea::placeholder{color:var(--muted)}
.cl-form select option{background:#1e293b;color:var(--text)}
.cl-form textarea{resize:none;height:64px}
.cl-form label{font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:-.2rem}
.estado-row{display:flex;gap:.5rem}
.estado-btn{
  flex:1;background:rgba(255,255,255,.06);border:1px solid var(--border);
  color:var(--muted);border-radius:10px;padding:.6rem;font-size:.82rem;font-weight:700;
  cursor:pointer;transition:all .2s;
}
.estado-btn.sel-consulta{background:rgba(245,158,11,.15);border-color:var(--yellow);color:var(--yellow)}
.estado-btn.sel-cliente {background:rgba(16,185,129,.15);border-color:var(--green); color:var(--green)}
.form-actions{display:flex;gap:.5rem;margin-top:.2rem}
.btn-cancel{flex:1;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:.65rem;font-size:.85rem;cursor:pointer}
.btn-cancel:hover{color:var(--text)}
.btn-save  {flex:2;background:var(--purple);border:none;color:white;border-radius:10px;padding:.65rem;font-size:.85rem;font-weight:700;cursor:pointer}
.btn-save:hover{background:var(--purple2)}

/* Filtros */
.cl-filters{display:flex;gap:.5rem;margin-bottom:.8rem}
.cl-filter-btn{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:.5rem;font-size:.8rem;font-weight:700;cursor:pointer;transition:all .2s;text-align:center}
.cl-filter-btn.active{background:rgba(124,58,237,.25);border-color:var(--purple);color:var(--text)}

/* Lista clientes */
.cl-list{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1.2rem}
.cl-item{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:.9rem 1rem;display:flex;align-items:center;gap:.8rem;
  transition:border-color .2s;
}
.cl-item:hover{border-color:rgba(255,255,255,.15)}
.cl-avatar{
  width:40px;height:40px;border-radius:12px;background:var(--purple);
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;
  font-weight:800;color:white;flex-shrink:0;text-transform:uppercase;
}
.cl-info{flex:1;min-width:0}
.cl-name{font-size:.95rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-meta{font-size:.75rem;color:var(--muted);margin-top:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-notes{font-size:.75rem;color:rgba(241,245,249,.55);margin-top:.1rem;font-style:italic}
.cl-right{display:flex;flex-direction:column;align-items:flex-end;gap:.4rem;flex-shrink:0}
.cl-status-btn{font-size:.7rem;font-weight:800;padding:.25rem .6rem;border-radius:12px;cursor:pointer;transition:all .2s;border:1px solid transparent}
.cl-status-btn.consulta{background:rgba(245,158,11,.12);color:var(--yellow);border-color:rgba(245,158,11,.3)}
.cl-status-btn.cliente {background:rgba(16,185,129,.12);color:var(--green); border-color:rgba(16,185,129,.3)}
.cl-status-btn:hover{filter:brightness(1.2)}
.cl-del{background:none;border:none;color:rgba(255,255,255,.18);cursor:pointer;font-size:.85rem;transition:color .2s;padding:.1rem}
.cl-del:hover{color:var(--red)}
.cl-date{font-size:.65rem;color:rgba(255,255,255,.2)}
.cl-empty{text-align:center;padding:2.5rem 1rem;color:var(--muted);font-size:.9rem}
.cl-empty-icon{font-size:2rem;margin-bottom:.5rem}

/* Botones de acción */
.action-row{display:flex;gap:.6rem;margin-top:.7rem}
.btn-sync{
  flex:2;background:var(--purple);border:none;color:white;
  border-radius:12px;padding:.75rem;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .2s;
}
.btn-sync:hover{background:var(--purple2)}
.btn-sync:disabled{opacity:.5;cursor:not-allowed}
.btn-export{
  flex:1;background:rgba(255,255,255,.06);border:1px solid var(--border);
  color:var(--muted);border-radius:12px;padding:.75rem;font-size:.8rem;font-weight:700;
  cursor:pointer;transition:all .2s;text-align:center;
}
.btn-export:hover{background:rgba(255,255,255,.1);color:var(--text)}
.btn-excel{
  flex:1;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);
  color:#4ade80;border-radius:12px;padding:.75rem;font-size:.8rem;font-weight:700;
  cursor:pointer;transition:all .2s;text-align:center;
}
.btn-excel:hover{background:rgba(34,197,94,.18);color:#86efac}
.sync-status{font-size:.78rem;text-align:center;margin-top:.5rem;min-height:1.2em;color:var(--muted)}

/* Loading / toast */
.toast{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
  background:#1e293b;border:1px solid var(--border);color:var(--text);
  border-radius:12px;padding:.65rem 1.2rem;font-size:.85rem;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:9999;
  opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1}

@media(min-width:640px){
  .dash-content{padding:1.5rem 2rem}
  .stats-grid{grid-template-columns:repeat(3,1fr)}
  .cl-form{padding:1.3rem}
}
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🐾</div>
    <div class="login-title">La Casita de Simba</div>
    <div class="login-sub">Panel de administración</div>
    <input class="login-input" type="password" id="pass-input" placeholder="Contraseña" autocomplete="current-password" />
    <label class="login-remember">
      <input type="checkbox" id="remember" />
      Recordar contraseña en este dispositivo
    </label>
    <button class="login-btn" id="login-btn">Entrar →</button>
    <div class="login-error" id="login-error">Contraseña incorrecta</div>
  </div>
</div>

<!-- ── DASHBOARD ── -->
<div id="dashboard">
  <header class="dash-header">
    <div class="dash-brand">
      <span class="dash-brand-icon">🐾</span>
      La Casita · Admin
    </div>
    <button class="dash-logout" id="logout-btn">Cerrar sesión</button>
  </header>
  <div class="dash-tabs">
    <button class="dash-tab active" id="tab-stats-btn">📊 Estadísticas</button>
    <button class="dash-tab" id="tab-cl-btn">👥 Clientes</button>
  </div>
  <div class="dash-content">

    <!-- STATS -->
    <div id="section-stats">
      <div class="stats-refresh-row">
        <button class="btn-refresh" id="btn-refresh">↻ Actualizar</button>
      </div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="s-icon">👁</div>
          <div class="s-label">Visitas</div>
          <div class="stat-row">
            <div class="s-item"><span>Hoy</span><strong id="pv-h">—</strong></div>
            <div class="s-item"><span>7 días</span><strong id="pv-s">—</strong></div>
            <div class="s-item"><span>30 días</span><strong id="pv-m">—</strong></div>
          </div>
        </div>
        <div class="stat-card">
          <div class="s-icon">💬</div>
          <div class="s-label">WhatsApp</div>
          <div class="stat-row">
            <div class="s-item"><span>Hoy</span><strong id="ct-h">—</strong></div>
            <div class="s-item"><span>7 días</span><strong id="ct-s">—</strong></div>
            <div class="s-item"><span>30 días</span><strong id="ct-m">—</strong></div>
          </div>
        </div>
        <div class="stat-card">
          <div class="s-icon">📝</div>
          <div class="s-label">Formularios</div>
          <div class="stat-row">
            <div class="s-item"><span>Hoy</span><strong id="ld-h">—</strong></div>
            <div class="s-item"><span>7 días</span><strong id="ld-s">—</strong></div>
            <div class="s-item"><span>30 días</span><strong id="ld-m">—</strong></div>
          </div>
        </div>
      </div>
      <div class="stats-updated" id="stats-updated"></div>
    </div>

    <!-- CLIENTES -->
    <div id="section-cl" style="display:none">
      <div class="cl-summary">
        <span class="cl-badge consulta">💬 <span class="cl-cnt" id="cnt-consulta">0</span> consultas</span>
        <span class="cl-badge cliente">✅ <span class="cl-cnt" id="cnt-cliente">0</span> ventas</span>
      </div>

      <button class="btn-new" id="btn-new">＋ Añadir contacto</button>

      <!-- Formulario -->
      <div class="cl-form" id="cl-form">
        <label>Teléfono *</label>
        <input type="tel" id="f-tel" placeholder="612 345 678" />
        <label>Nombre <span style="font-weight:400;opacity:.5">(opcional)</span></label>
        <input type="text" id="f-nombre" placeholder="Nombre del cliente" autocomplete="off" />
        <label>Servicio</label>
        <select id="f-servicio">
          <option value="">Seleccionar servicio…</option>
          <option>Estancia Diurna</option>
          <option>Bono 7 días</option>
          <option>Bono Mensual</option>
          <option>Horas Sueltas</option>
          <option>Cumpleaños / Evento</option>
        </select>
        <label>Estado</label>
        <div class="estado-row">
          <button class="estado-btn sel-consulta" id="e-consulta">💬 Solo consulta</button>
          <button class="estado-btn" id="e-cliente">✅ Venta cerrada</button>
        </div>
        <label>Notas</label>
        <textarea id="f-notas" placeholder="Raza, edad, horario, observaciones…"></textarea>
        <div class="form-actions">
          <button class="btn-cancel" id="f-cancel">Cancelar</button>
          <button class="btn-save" id="f-save">Guardar contacto</button>
        </div>
      </div>

      <!-- Filtros -->
      <div class="cl-filters">
        <button class="cl-filter-btn active" data-f="todos">Todos</button>
        <button class="cl-filter-btn" data-f="consulta">Consultas</button>
        <button class="cl-filter-btn" data-f="cliente">Ventas</button>
      </div>

      <!-- Lista -->
      <div class="cl-list" id="cl-list">
        <div class="cl-empty"><div class="cl-empty-icon">🐕</div>Sin contactos aún</div>
      </div>

      <div class="action-row">
        <button class="btn-sync" id="btn-sync">🔄 Sincronizar con Meta</button>
        <button class="btn-excel" id="btn-excel">📊 Excel</button>
        <button class="btn-export" id="btn-export" title="CSV para Meta Ads">⬇ CSV</button>
      </div>
      <div class="sync-status" id="sync-status"></div>
    </div>

  </div><!-- /dash-content -->
</div><!-- /dashboard -->

<div class="toast" id="toast"></div>

<script>
var API  = 'https://casitadesimba.vercel.app/api';
var T    = 'simba2026';
var PASS = 'simba2026';

// ── Auth ──
var savedPass = localStorage.getItem('ap_pass');
if (savedPass === PASS) boot();

document.getElementById('pass-input').addEventListener('keydown', function(e){ if(e.key==='Enter') tryLogin(); });
document.getElementById('login-btn').addEventListener('click', tryLogin);

function tryLogin() {
  var v = document.getElementById('pass-input').value;
  if (v === PASS) {
    if (document.getElementById('remember').checked) localStorage.setItem('ap_pass', PASS);
    boot();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('pass-input').focus();
  }
}

function boot() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display    = 'flex';
  loadStats();
}

document.getElementById('logout-btn').addEventListener('click', function() {
  localStorage.removeItem('ap_pass');
  location.reload();
});

// ── Tabs ──
document.getElementById('tab-stats-btn').addEventListener('click', function(){ showTab('stats'); });
document.getElementById('tab-cl-btn').addEventListener('click', function(){ showTab('cl'); loadClients(); });

function showTab(t) {
  document.getElementById('section-stats').style.display = t==='stats' ? '' : 'none';
  document.getElementById('section-cl').style.display    = t==='cl'    ? '' : 'none';
  document.getElementById('tab-stats-btn').classList.toggle('active', t==='stats');
  document.getElementById('tab-cl-btn').classList.toggle('active',    t==='cl');
}

// ── Stats ──
function fmt(n) { return n==null?'0': n>=1000?(n/1000).toFixed(1)+'k':String(n); }

function loadStats() {
  document.getElementById('stats-updated').textContent = 'Actualizando…';
  fetch(API+'/stats?t='+T).then(function(r){return r.json();}).then(function(s){
    document.getElementById('pv-h').textContent = fmt(s.hoy.pv);
    document.getElementById('pv-s').textContent = fmt(s.semana.pv);
    document.getElementById('pv-m').textContent = fmt(s.mes.pv);
    document.getElementById('ct-h').textContent = fmt(s.hoy.ct);
    document.getElementById('ct-s').textContent = fmt(s.semana.ct);
    document.getElementById('ct-m').textContent = fmt(s.mes.ct);
    document.getElementById('ld-h').textContent = fmt(s.hoy.ld);
    document.getElementById('ld-s').textContent = fmt(s.semana.ld);
    document.getElementById('ld-m').textContent = fmt(s.mes.ld);
    document.getElementById('stats-updated').textContent = 'Actualizado a las '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  }).catch(function(){
    document.getElementById('stats-updated').textContent = 'Error al cargar';
  });
}
document.getElementById('btn-refresh').addEventListener('click', loadStats);
setInterval(loadStats, 60000);

// ── Clients ──
var clients = [];
var filterVal = 'todos';
var estadoSel = 'consulta';

function loadClients() {
  fetch(API+'/clients?t='+T).then(function(r){return r.json();}).then(function(d){
    clients = d; renderClients();
  }).catch(function(){});
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function initial(n){ return (n||'?').trim().charAt(0).toUpperCase(); }

function renderClients() {
  var nc = clients.filter(function(c){return c.estado==='consulta';}).length;
  var nk = clients.filter(function(c){return c.estado==='cliente'; }).length;
  document.getElementById('cnt-consulta').textContent = nc;
  document.getElementById('cnt-cliente').textContent  = nk;

  var shown = filterVal==='todos' ? clients : clients.filter(function(c){return c.estado===filterVal;});
  var list  = document.getElementById('cl-list');

  if (!shown.length) {
    list.innerHTML = '<div class="cl-empty"><div class="cl-empty-icon">🐕</div>Sin contactos'+
      (filterVal!=='todos'?' con este estado':' aún')+'</div>';
    return;
  }

  list.innerHTML = shown.map(function(c){
    return '<div class="cl-item">'+
      '<div class="cl-avatar">'+initial(c.nombre)+'</div>'+
      '<div class="cl-info">'+
        '<div class="cl-name">'+esc(c.nombre)+'</div>'+
        '<div class="cl-meta">'+esc(c.tel||'Sin teléfono')+' · '+esc(c.servicio||'Sin servicio')+'</div>'+
        (c.notas?'<div class="cl-notes">'+esc(c.notas)+'</div>':'')+
      '</div>'+
      '<div class="cl-right">'+
        '<button class="cl-status-btn '+c.estado+'" data-toggle="'+c.id+'">'+
          (c.estado==='cliente'?'✅ Venta':'💬 Consulta')+
        '</button>'+
        '<span class="cl-date">'+esc(c.fecha||'')+'</span>'+
        '<button class="cl-del" data-del="'+c.id+'" title="Eliminar">✕</button>'+
      '</div>'+
    '</div>';
  }).join('');
}

document.getElementById('cl-list').addEventListener('click', function(e) {
  var tid = e.target.getAttribute('data-toggle');
  if (tid) {
    var c = clients.find(function(x){return x.id===tid;});
    if (!c) return;
    var nv = c.estado==='cliente'?'consulta':'cliente';
    fetch(API+'/clients?t='+T+'&id='+tid,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({estado:nv})})
      .then(function(){loadClients(); showToast(nv==='cliente'?'✅ Marcado como venta':'💬 Marcado como consulta');});
  }
  var did = e.target.getAttribute('data-del');
  if (did && confirm('¿Eliminar este contacto?')) {
    fetch(API+'/clients?t='+T+'&id='+did,{method:'DELETE'}).then(function(){loadClients(); showToast('Contacto eliminado');});
  }
});

document.querySelectorAll('.cl-filter-btn').forEach(function(b){
  b.addEventListener('click', function(){
    filterVal = this.getAttribute('data-f');
    document.querySelectorAll('.cl-filter-btn').forEach(function(x){x.classList.remove('active');});
    this.classList.add('active');
    renderClients();
  });
});

// Nuevo contacto
document.getElementById('btn-new').addEventListener('click', function(){
  document.getElementById('cl-form').classList.add('open');
  this.style.display = 'none';
  document.getElementById('f-tel').focus();
});
document.getElementById('f-cancel').addEventListener('click', closeForm);

function closeForm(){
  document.getElementById('cl-form').classList.remove('open');
  document.getElementById('btn-new').style.display = '';
  ['f-tel','f-nombre','f-notas'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('f-servicio').value = '';
  setEstado('consulta');
}

document.getElementById('e-consulta').addEventListener('click', function(){setEstado('consulta');});
document.getElementById('e-cliente').addEventListener('click',  function(){setEstado('cliente');});
function setEstado(v){
  estadoSel = v;
  document.getElementById('e-consulta').className='estado-btn'+(v==='consulta'?' sel-consulta':'');
  document.getElementById('e-cliente').className ='estado-btn'+(v==='cliente' ?' sel-cliente' :'');
}

document.getElementById('f-save').addEventListener('click', function(){
  var tel = document.getElementById('f-tel').value.trim();
  if (!tel){ document.getElementById('f-tel').focus(); return; }
  var nombre = document.getElementById('f-nombre').value.trim() || tel;
  var btn = this; btn.textContent = 'Guardando…'; btn.disabled = true;
  fetch(API+'/clients?t='+T,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({nombre:nombre, tel:tel,
      servicio:document.getElementById('f-servicio').value, estado:estadoSel,
      notas:document.getElementById('f-notas').value.trim()})
  }).then(function(){
    closeForm(); loadClients();
    btn.textContent='Guardar contacto'; btn.disabled=false;
    showToast('✅ Contacto guardado');
  }).catch(function(){ btn.textContent='Error — reintenta'; btn.disabled=false; });
});

// Sincronizar con Meta
document.getElementById('btn-sync').addEventListener('click', function(){
  var to = filterVal==='todos' ? clients : clients.filter(function(c){return c.estado===filterVal;});
  if (!to.length){ showToast('Sin contactos para sincronizar'); return; }
  var btn = this; var status = document.getElementById('sync-status');
  btn.disabled = true;
  btn.textContent = '⏳ Sincronizando…';
  status.textContent = '';
  fetch(API+'/sync-audience?t='+T+'&filter='+filterVal, { method:'POST' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.ok) {
        status.style.color = 'var(--green)';
        status.textContent = d.msg + ' · Público ID: ' + d.audienceId;
        showToast(d.msg);
      } else {
        status.style.color = 'var(--red)';
        status.textContent = '❌ ' + d.msg;
        showToast('❌ ' + d.msg);
      }
    })
    .catch(function(e){ status.style.color='var(--red)'; status.textContent='Error de conexión'; showToast('Error de conexión'); })
    .finally(function(){ btn.disabled=false; btn.textContent='🔄 Sincronizar con Meta'; });
});

// Exportar CSV (respaldo)
document.getElementById('btn-export').addEventListener('click', function(){
  var to = filterVal==='todos' ? clients : clients.filter(function(c){return c.estado===filterVal;});
  if (!to.length){ showToast('Sin contactos para exportar'); return; }
  var rows = [['phone','first_name','last_name','country']].concat(to.map(function(c){
    var p = (c.nombre||'').trim().split(' ');
    var tel = (c.tel||'').replace(/\s/g,'');
    if (tel && !/^\+/.test(tel)) tel = '+34'+tel.replace(/^0034/,'').replace(/^34/,'');
    return [tel, p[0]||'', p.slice(1).join(' ')||'', 'ES'];
  }));
  var csv = rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = 'casita_audiencia_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  showToast('⬇ CSV descargado — '+to.length+' contactos');
});

// Exportar Excel (.xlsx)
document.getElementById('btn-excel').addEventListener('click', function(){
  var to = filterVal==='todos' ? clients : clients.filter(function(c){return c.estado===filterVal;});
  if (!to.length){ showToast('Sin contactos para exportar'); return; }

  if (typeof XLSX === 'undefined') {
    showToast('Cargando librería Excel…');
    var s = document.createElement('script');
    s.src = 'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = function(){ doExcelExport(to); };
    document.head.appendChild(s);
  } else {
    doExcelExport(to);
  }
});

function doExcelExport(rows) {
  var data = rows.map(function(c){
    return {
      'Nombre'  : c.nombre   || '',
      'Teléfono': c.tel      || '',
      'Servicio': c.servicio || '',
      'Estado'  : c.estado === 'cliente' ? 'Cliente' : 'Consulta',
      'Fecha'   : c.fecha    || '',
      'Notas'   : c.notas    || '',
    };
  });

  var ws = XLSX.utils.json_to_sheet(data);

  // Ancho de columnas
  ws['!cols'] = [
    {wch:22}, {wch:16}, {wch:20}, {wch:12}, {wch:12}, {wch:35}
  ];

  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Clientes');

  var filename = 'casita_clientes_' + new Date().toISOString().slice(0,10) + '.xlsx';
  XLSX.writeFile(wb, filename);
  showToast('📊 Excel descargado — ' + rows.length + ' contactos');
}

// Toast
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}
</script>
</body>
</html>
